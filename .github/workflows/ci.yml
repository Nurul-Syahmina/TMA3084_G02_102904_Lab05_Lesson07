name: Flutter CI

on:
  push:
  pull_request:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - bottom_navigator_bar_lab
          - data_table_lab

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test